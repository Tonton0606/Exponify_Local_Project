<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/EXPONIFY_LOGO.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#d4a017" />
    <meta name="description" content="All-in-one CRM, Marketing, Accounting & AI Platform for Philippine SMEs" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Exponify" />
    <link rel="apple-touch-icon" href="/src/assets/EXPONIFY_LOGO.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>ExponifyPH</title>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('[SW] Registered:', reg.scope),
            (err) => console.warn('[SW] Registration failed:', err)
          );
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
